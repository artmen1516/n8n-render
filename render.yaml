# Use this Blueprint to deploy n8n on Render as a web
# service that uses a Supabase Postgres database to store
# workflow data. It also sets up a worker to give access to a Tailscale VPN.

# ⚠️ This Blueprint uses free instance types. Watch the quota limits ⚠️
# ⚠️ REFERENCED SECRETS MUST EXIST IN RENDER BEFORE A DEPLOYMENT ⚠️

services:
  - type: web
    plan: free 
    runtime: image # This is the runtime for services that pull a prebuilt Docker image
    name: n8n-service # You can give the service any name
    healthCheckPath: /healthz
    image:
      url: docker.io/n8nio/n8n:1.93.0 # stable version in Docker Hub at 2025-05-24
    envVars:
      # ----- N8N -----
      - key: N8N_ENCRYPTION_KEY # Generates a base64-encoded key for encrypting credentials in n8n
        generateValue: true
      - key: OLLAMA_BASE_URL # Variable available inside n8n
        sync: false
      #  ----- Supabase Postgres database -----
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_SSL_ENABLED # Supabase requires SSL
        value: "true"
      - key: DB_POSTGRESDB_POOL_SIZE # Qty of parallel open Postgres connections n8n should have
        value: "2"
      - key: DB_POSTGRESDB_DATABASE
        value: "postgres"
      # Loads all env vars from a specific group
      - fromGroup: n8n-self-hosted

      # ---- Commented since they are already loaded from the group, leaving them here as a reference ----
      # - key: DB_POSTGRESDB_HOST # db.<PROJECT-REF>.supabase.co https://xqecjvcdysxacdyoodmr.supabase.co
      #   sync: false
      # - key: DB_POSTGRESDB_USER
      #   sync: false
      # - key: DB_POSTGRESDB_PASSWORD
      #   sync: false
      # - key: DB_POSTGRESDB_SSL_CA #CA you stored as a secret
      #   sync: false

  - type: web # Original approach uses a worker, but is not part of the free tier.
    plan: free 
    name: tailscale-subnet-router
    env: docker
    repo: https://github.com/render-examples/tailscale
    branch: main
    # --------------
    autoDeploy: false # keep the version you pick
    envVars:
      - key: TAILSCALE_VERSION # bump to the current stable
        value: 1.64.0 # template version
      - key: ADVERTISE_ROUTES # publish all Render 10.x nets
        value: 10.0.0.0/8
      # Load all env vars from a specific group
      - fromGroup: n8n-self-hosted
      # Variable reference only
      # - key: TAILSCALE_AUTHKEY # add this secret in the UI
      #   sync: false
      
    # disk: # persist the node key between deploys
    #   name: tailscale-state
